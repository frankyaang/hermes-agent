# GStack Control Protocol — SDLC phase definitions
# THIS FILE IS THE SINGLE SOURCE OF TRUTH FOR ALL GSTACK PHASES.
# phase_registry.py loads from here; specs.py must not duplicate KNOWN_PHASES.

version: "0.3.0"
description: "GStack SDLC phase protocol for Hermes integration — full 24-specialist mapping"

# Known gstack commands (from garrytan/gstack upstream).
# gstack CLI is not required; Hermes uses methodology_only invocation.
# gstack SKILL.md files serve as methodology documentation, not executable scripts.
known_commands:
  # Scheduler layer (planning gates)
  - office-hours
  - plan-eng-review
  - plan-ceo-review
  - plan-design-review
  - plan-devex-review
  - autoplan
  # Expert layer (review & advisory)
  - review
  - careful
  - guard
  - investigate
  - health
  - cso
  - design-consultation
  - design-review
  - design-shotgun
  - devex-review
  # Skill layer (execution)
  - qa
  - qa-only
  - ship
  - land-and-deploy
  - canary
  - benchmark
  - benchmark-models
  - design-html
  # Sedimentation layer
  - retro
  - learn
  # Tool layer (optional binary)
  - browse
  - pair-agent

phases:
  # ─── Scheduler Layer ───────────────────────────────────────────────────────

  - id: gstack.office_hours
    label: "Office Hours / Strategic Review"
    description: "开放性战略咨询，任意 pipeline 启动前可激活"
    gstack_command: office-hours
    hermes_layer: scheduler
    hermes_skill: gstack_plan_gate
    risk_level: low
    allowed_modes:
      - advisory
    blocking_allowed: false
    production_ready: false
    real_gstack: false
    absorption_status: approved

  - id: gstack.plan_eng_review
    label: "Plan / Engineering Review"
    description: "实现开始前的工程评审门禁"
    gstack_command: plan-eng-review
