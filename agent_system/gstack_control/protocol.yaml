risk_levels:
  low:
    default_mode: advisory
    description: "Advisory suggestion only"
  medium:
    default_mode: shadow
    description: "Record only, no intervention"
  high:
    default_mode: advisory
    description: "Return suggestion, never block"

mode_semantics:
  disabled: "No-op. gstack_control has zero effect."
  shadow: "Observe and record only. No user-visible output."
  advisory: "Return a suggestion. Never block execution."
  controlled: |
    Execute under allowlist + kill_switch + budget_guard + dry_run.
    Requires explicit human approval. MVP: dry_run_only=True.
  quarantined: |
    Failure isolation. Record evidence. Hermes original chain continues.
    Requires manual human reset to exit quarantined state.

constraints:
  - "blocking is never a default response"
  - "use_real_gstack is always false in MVP"
  - "browser_daemon is always false in MVP"
  - "gbrain is always false in MVP"
  - "all paths must use get_hermes_home() from hermes_constants"
  - "no hardcoded gstack home path — always use get_hermes_home()"
  - "no token/cookie/Authorization/Bearer in metrics"
  - "controlled requires allowlist + kill_switch + budget + human approval"
  - "quarantined requires manual human reset"
  - "gstack SKILL.md = methodology_only — bash preamble not executed by Hermes runtime"
  - "gstack cannot write directly to system_mem/expert_mem/skill_mem (ACL enforced)"
  - "gstack outputs route through staging -> human review -> experience_card"
